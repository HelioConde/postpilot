name: Visual Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'i18n.js'
      - 'ads.js'
      - 'ads-config.js'
      - 'pwa.js'
      - 'sw.js'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'scripts/capture-page.js'
      - '.github/workflows/visual-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: postpilot-visual-snapshot
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start PostPilot
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/postpilot-http.log 2>&1 &
          echo $! > /tmp/postpilot-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/postpilot-http.log
          exit 1

      - name: Capture full page
        run: node scripts/capture-page.js

      - name: Upload visual artifact
        uses: actions/upload-artifact@v4
        with:
          name: postpilot-visual-snapshot
          path: |
            screenshots/postpilot-desktop.png
            screenshots/postpilot-mobile.png
            screenshots/visual-state.json
          retention-days: 30

      - name: Commit latest screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/postpilot-desktop.png screenshots/postpilot-mobile.png screenshots/visual-state.json
          if git diff --cached --quiet; then
            echo "No visual changes detected."
            exit 0
          fi
          git commit -m "chore: refresh visual snapshots [skip ci]"
          git push
