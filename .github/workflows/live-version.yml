name: Live version

on:
  push:
    branches: [main]
    paths-ignore:
      - version.json
      - screenshots/**

permissions:
  contents: write

concurrency:
  group: live-version-main
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish deployed version marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            target_sha="$(git log -1 --format=%H -- . ':(exclude)version.json' ':(exclude)screenshots/**')"
            printf '{"sha":"%s","publishedAt":"%s"}\n' "$target_sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

            git add version.json
            if git diff --cached --quiet; then
              echo "Version marker already current."
              exit 0
            fi

            git commit -m "chore: refresh live version [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another automation; rebuilding marker on latest main..."
            sleep 2
          done

          echo "Could not publish version marker after 3 attempts."
          exit 1
