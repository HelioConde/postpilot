name: Static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: postpilot-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-config.js
          node --check i18n.js
          node --check ads-config.js
          node --check ads.js
          node --check pwa.js
          node --check beta-feedback.js
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f README.md
          test -f FULLSTACK.md
          test -f supabase/migrations/20261006061000_multiplatform_workflow.sql
          test -f supabase/migrations/20261006093000_editorial_planning.sql
          test -f supabase/migrations/20261006100000_publish_checklist.sql
          test -f i18n.js
          test -f ads-config.js
          test -f ads.js
          test -f MELHORIAS.md
          test -f manifest.webmanifest
          test -f icon.svg
          test -f sw.js
          test -f pwa.js
          test -f beta-feedback.js
          test -f supabase/migrations/20261006103000_beta_feedback.sql
          test -f supabase/functions/postpilot-beta-feedback/index.ts
          test -f supabase/functions/postpilot-generate/index.ts
          test -f supabase/functions/postpilot-transcribe/index.ts
          test -f supabase/migrations/20261006112500_ai_generation.sql
          test -f supabase/migrations/20261006121500_media_transcription.sql
          test -f supabase/migrations/20261006150000_usage_limits.sql
          test -f supabase/migrations/20261006150500_consume_usage_rpc.sql
          test -f supabase/migrations/20261006151000_private_usage_schema.sql
          test -f supabase/migrations/20261006151200_usage_service_policy.sql
          test -f supabase/migrations/20261006151500_usage_status_rpc.sql
          test -f supabase/migrations/20261006152000_usage_retention.sql
          test -f package.json
          test -f playwright.config.js
          test -f tests/e2e/critical-flow.spec.js
          test -f .github/workflows/e2e.yml
          test -f static-page.js
          test -f sobre.html
          test -f privacidade.html
          test -f termos.html
          test -f contato.html
      - name: Check SEO and backend boot
        run: |
          grep -qi '<title' index.html
          grep -qi 'meta name="viewport"' index.html
          grep -qi 'meta name="description"' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'supabase-config.js' index.html
          grep -qi 'name="platforms"' index.html
          grep -qi 'project-status-filter' index.html
          grep -qi 'platformDeliverable' app.js
          grep -qi 'data-status-id' app.js
          grep -qi 'export-format' app.js
          grep -qi 'packageMarkdown' app.js
          grep -qi 'packageCsv' app.js
          grep -qi 'data-language="pt-BR"' index.html
          grep -qi 'data-language="en"' index.html
          grep -qi 'project-search' index.html
          grep -qi 'production-summary' index.html
          grep -qi 'name="audience"' index.html
          grep -qi 'name="publishAt"' index.html
          grep -qi 'POSTPILOT_ADS' ads-config.js
          grep -qi 'data-ad-placement="app-footer"' index.html
          grep -qi '"@type":"WebApplication"' index.html
          grep -qi 'renderProductionSummary' app.js
          grep -qi 'publish_at' app.js
          grep -qi 'editorial-calendar' index.html
          grep -qi 'renderEditorialCalendar' app.js
          grep -qi 'data-edit-pack' app.js
          grep -qi 'data-template-pack' app.js
          grep -qi 'fillComposerFromPack' app.js
          grep -qi 'publish_checklist' app.js
          grep -qi 'publish-checklist' style.css
          grep -qi 'data-check-platform' app.js
          grep -qi 'manifest.webmanifest' index.html
          grep -qi 'serviceWorker' pwa.js
          grep -qi 'postpilot-shell-v1' sw.js
          grep -qi 'local-backup-controls' index.html
          grep -qi 'exportLocalBackup' app.js
          grep -qi 'restoreLocalBackup' app.js
          grep -qi 'content-template' index.html
          grep -qi 'applyContentTemplate' app.js
          grep -qi 'beta-feedback-open' index.html
          grep -qi 'postpilot-beta-feedback-queue-v1' beta-feedback.js
          grep -qi 'postpilot_beta_feedback' supabase/functions/postpilot-beta-feedback/index.ts

      - name: Check AI and media contracts
        run: |
          grep -qi 'ai-generation' index.html
          grep -qi 'postpilot-generate' app.js
          grep -qi 'media-file' index.html
          grep -qi 'postpilot-media' app.js
          grep -qi 'postpilot-transcribe' app.js
          grep -qi 'cutSuggestions' app.js
          grep -qi 'calendar-export' index.html
          grep -qi 'buildCalendarIcs' app.js
          grep -qi 'sobre.html' index.html
          grep -qi 'privacidade.html' index.html
          grep -qi 'termos.html' index.html
          grep -qi 'contato.html' index.html
          grep -qi 'postpilot_project_versions' supabase/migrations/20261006131500_project_versions.sql
          grep -qi 'content_overrides' supabase/migrations/20261006134500_content_overrides.sql
          grep -qi 'tus-js-client' index.html
          grep -qi 'service-health' index.html
          grep -qi 'action: .health.' app.js
          grep -qi 'postpilot_consume_usage' supabase/functions/postpilot-generate/index.ts
          grep -qi 'postpilot_consume_usage' supabase/functions/postpilot-transcribe/index.ts
          grep -qi 'AbortSignal.timeout(30000)' supabase/functions/postpilot-generate/index.ts
          grep -qi 'AbortSignal.timeout(120000)' supabase/functions/postpilot-transcribe/index.ts
          grep -qi 'postpilot_private.postpilot_usage_limits' supabase/migrations/20261006151000_private_usage_schema.sql
          grep -qi 'Transcrever agora' app.js
          grep -qi 'persistTranscriptionResult' app.js
          grep -qi 'pendingUploadedMedia' app.js
          grep -qi 'postpilot_usage_status' supabase/functions/postpilot-generate/index.ts
          grep -qi 'postpilot_usage_status' supabase/functions/postpilot-transcribe/index.ts
          grep -qi 'disponíveis nesta hora' app.js
          grep -qi '48 hours' supabase/migrations/20261006152000_usage_retention.sql
          grep -qi 'postpilot-tablet.png' .github/workflows/visual-snapshot.yml
