name: Static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: postpilot-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-config.js
          node --check i18n.js
          node --check ads-config.js
          node --check ads.js
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f README.md
          test -f FULLSTACK.md
          test -f supabase/migrations/20261006061000_multiplatform_workflow.sql
          test -f supabase/migrations/20261006093000_editorial_planning.sql
          test -f supabase/migrations/20261006100000_publish_checklist.sql
          test -f i18n.js
          test -f ads-config.js
          test -f ads.js
          test -f MELHORIAS.md
          test -f package.json
          test -f playwright.config.js
          test -f tests/e2e/critical-flow.spec.js
          test -f .github/workflows/e2e.yml
      - name: Check SEO and backend boot
        run: |
          grep -qi '<title' index.html
          grep -qi 'meta name="viewport"' index.html
          grep -qi 'meta name="description"' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'supabase-config.js' index.html
          grep -qi 'name="platforms"' index.html
          grep -qi 'project-status-filter' index.html
          grep -qi 'platformDeliverable' app.js
          grep -qi 'data-status-id' app.js
          grep -qi 'Exportar .txt' app.js
          grep -qi 'data-language="pt-BR"' index.html
          grep -qi 'data-language="en"' index.html
          grep -qi 'project-search' index.html
          grep -qi 'production-summary' index.html
          grep -qi 'name="audience"' index.html
          grep -qi 'name="publishAt"' index.html
          grep -qi 'POSTPILOT_ADS' ads-config.js
          grep -qi 'data-ad-placement="app-footer"' index.html
          grep -qi '"@type":"WebApplication"' index.html
          grep -qi 'renderProductionSummary' app.js
          grep -qi 'publish_at' app.js
          grep -qi 'editorial-calendar' index.html
          grep -qi 'renderEditorialCalendar' app.js
          grep -qi 'data-edit-pack' app.js
          grep -qi 'data-template-pack' app.js
          grep -qi 'fillComposerFromPack' app.js
          grep -qi 'publish_checklist' app.js
          grep -qi 'publish-checklist' style.css
          grep -qi 'data-check-platform' app.js
